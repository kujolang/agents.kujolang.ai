name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install reviewed Kujo release
        uses: kujolang/kujo/.github/actions/setup-kujo@a91702682e2969a66938b561b8059034ab2bc717
        with:
          version: v1.10.0

      - name: Build and validate site
        shell: bash
        run: |
          python3 tests/test_sync_agent_content.py
          kujo run ./build.kujo -- --site-url https://agents.kujolang.ai
          python3 scripts/validate-agent-content.py
          bash scripts/validate-generated-output.sh output
          node scripts/test-webmcp-runtime.js output/assets/js/kujo-webmcp.min.js output/.well-known/kujo-site-index.json

      - name: Upload site artifact
        shell: bash
        run: |
          tar --dereference --hard-dereference --directory ./output -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Store site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
