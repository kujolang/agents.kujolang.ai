name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Kujo 1.0.1
        shell: bash
        run: |
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.0.1/kujo-v1.0.1-linux-x64.tar.gz
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.0.1/kujo-v1.0.1-linux-x64.tar.gz.sha256
          sha256sum --check kujo-v1.0.1-linux-x64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.0.1-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Build and validate site
        shell: bash
        run: |
          kujo run ./build.kujo -- --site-url https://agents.kujolang.ai
          bash scripts/validate-generated-output.sh output

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./output
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
