name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Kujo 1.1.0
        shell: bash
        run: |
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.1.0/kujo-v1.1.0-linux-x64.tar.gz
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.1.0/kujo-v1.1.0-linux-x64.tar.gz.sha256
          sha256sum --check kujo-v1.1.0-linux-x64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.1.0-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Build and validate site
        shell: bash
        run: |
          kujo run ./build.kujo -- --site-url https://agents.kujolang.ai
          bash scripts/validate-generated-output.sh output

      - name: Upload site artifact
        shell: bash
        run: |
          tar --dereference --hard-dereference --directory ./output -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Store site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
