<main class="site-shell" id="main-content">
	<article class="agent-body kujo-content">
		<h1>{{title}}</h1>
		{{body}}
		<section id="slack-agent-setup" hidden>
			<h2>Your Slack bot setup</h2>
			<pre><code id="slack-setup-command"></code></pre>
			<p><a id="slack-local-setup">Open the local setup assistant</a></p>
			<p><a id="slack-portrait-download" download>Download this agent’s Slack portrait (PNG)</a></p>
		</section>
		<p id="slack-select-agent"><a href="/agents/">Choose an agent</a> and select Connect to Slack to see its setup command and portrait.</p>
	</article>
	<script src="/assets/js/slack-setup.js" defer></script>
</main>
