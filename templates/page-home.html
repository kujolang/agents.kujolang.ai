<main id="main-content">
	<section class="sk-hero chain-hero" aria-labelledby="hero-title">
		<div class="chain-hero__media" aria-hidden="true"><img src="/assets/images/agent-hero-background.webp" alt="" width="1672" height="941" fetchpriority="high"><canvas class="hero-dither-canvas" data-hero-dither></canvas></div>
		<div class="chain-hero__wash" aria-hidden="true"></div>
		<div class="sk-hero__inner">
			<div class="sk-stack">
				<p class="eyebrow">Kujo / Agent Library</p>
				<h1 id="hero-title">{{title}}</h1>
				<p>{{description}}</p>
				<div class="sk-hero__actions">
					<a class="sk-button" href="/agents/">Explore Agents</a>
					<a class="sk-button" data-variant="secondary" href="https://github.com/kujolang/kujo-agents" target="_blank" rel="noopener noreferrer">View Source</a>
				</div>
			</div>
		</div>
	</section>

	<div class="site-shell home-content-shell">
		<section class="sk-command-strip" aria-label="Roster status">
			<div><span>Library</span><strong>Growing roster</strong></div>
			<div><span>Content type</span><strong>Agents</strong></div>
			<div><span>Organization</span><strong>Agent sets</strong></div>
			<div><span>Status</span><strong>Operational</strong></div>
		</section>

		<div class="agent-sets">{{agent_sets_html}}</div>
	</div>
</main>
