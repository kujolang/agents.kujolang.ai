<main id="main-content">
	<section class="sk-hero chain-hero agent-platform-hero" aria-labelledby="agent-platform-title">
		<div class="chain-hero__media" aria-hidden="true"><img src="/assets/images/agent-development-platform.webp" alt="" width="1916" height="821" fetchpriority="high"></div>
		<div class="chain-hero__wash" aria-hidden="true"></div>
		<div class="sk-hero__inner">
			<div class="sk-stack">
				<p class="eyebrow">Kujo / Agent Development Platform</p>
				<h1 id="agent-platform-title">{{title}}</h1>
				<p>{{description}}</p>
				<div class="sk-hero__actions">
					<a class="sk-button" href="https://docs.kujolang.ai/build/owned-agent-projects/">Read the guide</a>
					<a class="sk-button" data-variant="secondary" href="https://github.com/kujolang/kujo">View Kujo source</a>
				</div>
			</div>
		</div>
	</section>
	<div class="site-shell agent-platform-shell">
		<section class="sk-command-strip" aria-label="Agent Development Platform features">
			<div><span>Install</span><strong>One command</strong></div>
			<div><span>Profiles</span><strong>7 owned paths</strong></div>
			<div><span>Credentials</span><strong>OS-backed store</strong></div>
			<div><span>First run</span><strong>Offline ready</strong></div>
		</section>
		<article class="agent-body kujo-content agent-platform-body">{{body}}</article>
	</div>
</main>
