<main id="main-content">
	<section class="publishing-system-hero" aria-labelledby="publishing-system-title">
		<div class="publishing-system-hero__copy">
			<p class="eyebrow">Kujo / Publishing House</p>
			<h1 id="publishing-system-title">{{title}}</h1>
			<p>{{description}}</p>
			<div class="sk-hero__actions">
				<a class="sk-button" href="/agents/publishing-house/">Explore 23 agents</a>
				<a class="sk-button" data-variant="secondary" href="https://github.com/kujolang/kujo-workflows/tree/main/docs/publishing-house">Run the workflows</a>
			</div>
		</div>
		<div class="publishing-system-hero__media">
			<img src="/assets/images/publishing-house-system.webp" alt="Interconnected editorial desks, evidence archive, galley press, approval seal, publication console, and reader-signal board" width="1916" height="821" fetchpriority="high" decoding="async">
		</div>
	</section>
	<div class="site-shell publishing-system-shell">
		<section class="sk-command-strip" aria-label="Publishing House system inventory">
			<div><span>Agents</span><strong>23 roles</strong></div>
			<div><span>Tools</span><strong>8 owners</strong></div>
			<div><span>Workflows</span><strong>11 stages</strong></div>
			<div><span>Skills</span><strong>11 guides</strong></div>
		</section>
		<article class="agent-body kujo-content publishing-system-body">{{body}}</article>
	</div>
</main>
