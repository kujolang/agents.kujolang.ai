<!doctype html>
<html lang="{{lang}}" data-theme="kujo-light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{page_title}}</title>
	<meta name="description" content="{{meta_description}}">
	<meta name="keywords" content="{{seo_keywords}}">
	<meta name="author" content="{{author_meta}}">
	{{canonical_tag}}
	<link rel="icon" type="image/svg+xml" href="{{relative_path}}assets/images/favicon.svg">
	{{rss_link_tag}}
	<meta property="og:title" content="{{seo_title}}">
	<meta property="og:description" content="{{seo_description}}">
	<meta property="og:url" content="{{og_url}}">
	<meta property="og:type" content="{{og_type}}">
	<meta property="og:site_name" content="{{site_title}}">
	<meta property="og:locale" content="{{og_locale}}">
	{{og_image_tag}}
	{{og_article_tags}}
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{seo_title}}">
	<meta name="twitter:description" content="{{seo_description}}">
	{{twitter_image_tag}}
	<link rel="stylesheet" href="{{relative_path}}assets/sitekit/sitekit.css?v=1.0.0">
	<link rel="stylesheet" href="{{relative_path}}assets/css/site.css?v=20260810-2">
	{{json_ld}}
</head>
<body>
	<a class="sk-skip-link" href="#main-content">Skip to main content</a>

	<header class="sk-header site-header" id="site-header">
		<div class="sk-header__inner">
			<a class="brand-lockup site-brand" href="{{home_path}}" aria-label="Kujo Agents home">
				<img src="{{relative_path}}assets/images/kujo-logomark.svg" alt="" width="28" height="28">
				<span>Kujo Agents</span>
			</a>
			<nav aria-label="Primary">
				<ul class="site-nav">
					<li><a href="{{relative_path}}agents/chain-of-command/">Chain of Command</a></li>
					<li><a href="{{relative_path}}agents/webops/">WebOps</a></li>
				</ul>
			</nav>
			<div class="sk-header__actions">
				<a class="sk-button" data-variant="secondary" href="https://github.com/kujolang/kujo-agents" target="_blank" rel="noopener noreferrer">Source</a>
			</div>
		</div>
	</header>

	{{content}}

	<footer class="sk-footer site-footer" id="footer">
		<div class="sk-footer__inner">
			<div class="site-footer__left">
				<a class="footer-wordmark" href="https://kujolang.ai"><img src="{{relative_path}}assets/images/kujo-logomark.svg" alt="" width="24" height="24"><span>Kujo</span></a>
				<nav aria-label="Footer"><a href="{{relative_path}}agents/">Agents</a></nav>
			</div>
		</div>
	</footer>
	<script src="{{relative_path}}assets/sitekit/sitekit.js" defer></script>
	<script src="{{relative_path}}assets/js/site.js?v=20260810-2" defer></script>
</body>
</html>
