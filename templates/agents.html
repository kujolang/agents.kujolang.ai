<main class="site-shell agent-detail" id="main-content">
	<nav class="sk-breadcrumbs" aria-label="Breadcrumb">
		<ol><li><a href="/">Home</a></li><li><a href="/agents/">Agents</a></li><li aria-current="page">{{title}}</li></ol>
	</nav>
	<article>
		<header class="agent-detail-header">
			<div class="agent-detail-copy">
				<p class="eyebrow">Kujo Agent Contract</p>
				<h1>{{title}}</h1>
				<p class="agent-lede">{{description}}</p>
				<div class="agent-taxonomies">{{categories_html}}{{tags_html}}{{taxonomies_html}}</div>
			</div>
			<div class="agent-mark">{{featured_image_html}}</div>
		</header>
		<div class="agent-body kujo-content">{{body}}</div>
	</article>
	<nav class="agent-detail-nav" aria-label="Agent directory navigation">
		<a class="sk-button" data-variant="secondary" href="/agents/">Back to all agents</a>
	</nav>
</main>
